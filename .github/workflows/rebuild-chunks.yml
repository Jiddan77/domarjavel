name: Rebuild Chunks

on:
  push:
    paths:
      - 'Backend/data/data.json'

jobs:
  rebuild:
    # Skip when the daily update bot pushes (it already rebuilds chunks itself)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: Backend/requirements-workflow.txt

      - name: Install Python dependencies
        run: pip install -r Backend/requirements-workflow.txt

      - name: Rebuild chunks
        run: python3 Backend/scripts/lib/create_optimized_chunks.py

      - name: Commit chunks if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Backend/data/chunks/
          git diff --staged --quiet || git commit -m "chore: rebuild chunks after data.json update" && git push
