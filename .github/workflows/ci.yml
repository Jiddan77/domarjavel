name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('Backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd Backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        cd Backend
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy
      run: |
        cd Backend
        pip install mypy
        mypy app/ --ignore-missing-imports || true
    
    - name: Test API endpoints
      run: |
        cd Backend
        # Create minimal test data
        mkdir -p data
        echo '{"matches": []}' > data/data.json
        # Start server in background and test basic endpoints
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        curl -f http://localhost:8000/docs || exit 1

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd Frontend
        npm install
    
    - name: Lint
      run: |
        cd Frontend
        npm run lint
      continue-on-error: true
    
    - name: Type check
      run: |
        cd Frontend
        npm run type-check
      continue-on-error: true
    
    - name: Build
      run: |
        cd Frontend
        npm run build
    
    - name: Test build output
      run: |
        cd Frontend
        test -d .next

  integration-test:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json
    
    - name: Install backend dependencies
      run: |
        cd Backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm ci
    
    - name: Create test data
      run: |
        cd Backend
        mkdir -p data
        echo '{"matches": [{"match_id": 1, "season": 2025, "home": "Test Team A", "away": "Test Team B", "referee": "Test Referee", "score": "1-0", "yellow": "2-1", "red": "0-0", "penalty": "0-0", "status": "FINISHED"}]}' > data/data.json
    
    - name: Start backend
      run: |
        cd Backend
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
    
    - name: Test API integration
      run: |
        # Test core endpoints
        curl -f http://localhost:8000/health
        curl -f http://localhost:8000/matches
        curl -f http://localhost:8000/seasons
        curl -f http://localhost:8000/referees
        curl -f http://localhost:8000/teams
        curl -f http://localhost:8000/stats
    
    - name: Build frontend
      run: |
        cd Frontend
        NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
      continue-on-error: true